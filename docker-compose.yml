services:
  baby-tracker:
    # Build from this repo. On TrueNAS you can also point `image:` at a
    # prebuilt image (e.g. from GHCR) and drop the `build:` block — see README.
    build:
      context: .
      dockerfile: Dockerfile
    image: baby-tracker:latest
    container_name: baby-tracker
    restart: unless-stopped
    ports:
      # host:container — change the left number if 3000 is taken on your NAS.
      - "3000:3000"
    environment:
      - TZ=America/New_York # set to your timezone
      - DB_PATH=/data/baby-tracker.db
      # The container starts as root, fixes ownership of /data, then runs as
      # this user. Set these to match your dataset's owner if you prefer (e.g.
      # TrueNAS "apps" is often 568). Defaults to 1001:1001.
      # - PUID=1001
      # - PGID=1001
    volumes:
      # Persist the SQLite database. Point the left side at a TrueNAS dataset
      # (e.g. /mnt/tank/apps/baby-tracker) to get snapshots & backups.
      - baby-tracker-data:/data

volumes:
  baby-tracker-data:
